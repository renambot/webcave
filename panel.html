<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebCAVE · panel</title>
    <style>
      :root {
        --bg: #0d1013;
        --panel: #14181d;
        --panel-edge: #1f262d;
        --ink: #dfe5ea;
        --muted: #79848d;
        --amber: #ffb300;
        --amber-dim: rgba(255, 179, 0, 0.35);
        --green: #3ddc84;
        --red: #ff6b5c;
        --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg, #0b0d12); color: var(--fg, #e6e6e6);
        font-family: var(--sans, system-ui, sans-serif); font-size: 14px;
        display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; gap: 12px; padding: 10px 14px;
        border-bottom: 1px solid var(--panel-edge, #262a33);
        font-family: var(--mono, ui-monospace, monospace); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
      }
      header .brand { color: var(--amber, #f59e0b); font-weight: 700; }
      header .status { margin-left: auto; color: var(--muted, #8b93a5); text-transform: none; letter-spacing: 0; }
      main { flex: 1; overflow: auto; padding: 14px 16px; max-width: 720px; width: 100%; margin: 0 auto; }
      .note { color: var(--muted, #8b93a5); }
    </style>
  </head>
  <body>
    <header><span class="brand">WebCAVE</span> · panel <span id="app-name"></span><span class="status" id="status">connecting…</span></header>
    <main id="panel"><p class="note">Waiting for the Manager…</p></main>
    <script type="module" src="/src/panel/main.ts"></script>
  </body>
</html>
